name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source files match MANIFEST.json
        run: python -m nhs_outpatients verify
      - name: Unit and reconciliation tests
        run: python -m unittest discover -s tests -v
      - name: Build the real-data report
        run: python -m nhs_outpatients --output build/real
      - name: Committed report is up to date
        run: diff -q build/real/findings.json reports/findings.json
      - name: Synthetic test harness
        run: python -m access_lab run --rows 2400 --seed 42 --output build/synthetic
